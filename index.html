<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 3급 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Noto+Sans+SC:wght@400;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1C1917;
  --paper: #FAF7F2;
  --warm: #F5F0E8;
  --red: #C0392B;
  --gold: #D4A017;
  --gold2: #F1C40F;
  --teal: #16A085;
  --slate: #2C3E50;
  --muted: #7F8C8D;
  --border: rgba(28,25,23,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
header{
  background:var(--ink);color:var(--paper);
  padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;border-bottom:3px solid var(--red);
}
.logo{display:flex;align-items:center;gap:14px;}
.logo-char{font-family:'Noto Sans SC';font-size:28px;font-weight:900;color:var(--gold2);text-shadow:0 0 20px rgba(241,196,15,0.4);}
.logo-text{font-family:'Syne';font-size:17px;font-weight:800;}
.logo-sub{font-size:10px;color:rgba(250,247,242,0.45);margin-top:2px;letter-spacing:1px;text-transform:uppercase;}
.hdr-scores{display:flex;gap:10px;}
.hdr-score{background:rgba(250,247,242,0.08);border:1px solid rgba(250,247,242,0.14);border-radius:8px;padding:6px 14px;text-align:center;}
.hdr-score-n{font-family:'Syne';font-size:18px;font-weight:800;color:var(--gold2);}
.hdr-score-l{font-size:9px;color:rgba(250,247,242,0.45);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px;}
nav{background:var(--warm);border-bottom:2px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{flex-shrink:0;padding:13px 16px;border:none;background:transparent;color:var(--muted);font-family:'Noto Sans KR';font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;}
nav button.on{color:var(--red);border-bottom-color:var(--red);}
nav button:hover:not(.on){color:var(--ink);}
.sec{display:none;max-width:700px;margin:0 auto;padding:24px 18px;}
.sec.on{display:block;animation:up 0.3s ease;}
@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.sec-head{font-family:'Syne';font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.sec-head em{font-style:normal;background:var(--red);color:white;font-size:11px;padding:3px 9px;border-radius:4px;font-family:'Noto Sans KR';letter-spacing:0.5px;}

/* FLASHCARD */
.fc-cat-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.cchip{padding:5px 12px;border-radius:4px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR';transition:all 0.18s;}
.cchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.fc-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.fc-prog{font-size:12px;color:var(--muted);}
.pbar{height:4px;background:rgba(28,25,23,0.1);border-radius:99px;overflow:hidden;margin-bottom:20px;}
.pbar-fill{height:100%;background:var(--red);border-radius:99px;transition:width 0.4s;}
.card-wrap{perspective:1400px;margin-bottom:16px;}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);cursor:pointer;border-radius:18px;height:260px;}
.card-inner.flip{transform:rotateY(180deg);}
.card-f,.card-b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(28,25,23,0.12);}
.card-f{background:var(--ink);border:2px solid rgba(250,247,242,0.06);}
.card-b{background:var(--warm);border:2px solid var(--border);transform:rotateY(180deg);}
.card-zh{font-family:'Noto Sans SC';font-weight:900;color:var(--gold2);line-height:1;text-shadow:0 2px 24px rgba(241,196,15,0.2);text-align:center;}
.card-zh.sz1{font-size:72px;}
.card-zh.sz2{font-size:54px;}
.card-zh.sz3{font-size:40px;}
.card-hint{font-size:11px;color:rgba(250,247,242,0.3);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
.card-badge{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;color:rgba(250,247,242,0.3);background:rgba(250,247,242,0.06);border-radius:4px;padding:3px 8px;letter-spacing:0.5px;}
.card-ko{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px;text-align:center;}
.card-py{font-size:14px;color:var(--muted);margin-bottom:12px;font-style:italic;}
.card-ex{font-family:'Noto Sans SC';font-size:14px;color:var(--slate);line-height:1.7;text-align:center;margin-bottom:4px;}
.card-exko{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;}
.ex-hl{color:var(--red);font-weight:700;}
.fc-actions{display:flex;gap:10px;margin-bottom:10px;}
.fcb{flex:1;padding:13px;border-radius:10px;border:none;font-family:'Noto Sans KR';font-size:14px;font-weight:700;cursor:pointer;transition:all 0.18s;}
.fcb-f{background:var(--warm);border:1.5px solid var(--border);color:var(--muted);}
.fcb-f:hover{background:var(--ink);color:var(--paper);}
.fcb-n{background:rgba(192,57,43,0.08);border:1.5px solid rgba(192,57,43,0.2);color:var(--red);}
.fcb-n:hover{background:var(--red);color:white;}
.fcb-y{background:rgba(22,160,133,0.08);border:1.5px solid rgba(22,160,133,0.2);color:var(--teal);}
.fcb-y:hover{background:var(--teal);color:white;}
.fc-rate{display:none;}
.fc-rate.show{display:flex;}

/* QUIZ */
.qtype-row{display:flex;gap:8px;margin-bottom:18px;}
.qtype-btn{flex:1;padding:9px 6px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:'Noto Sans KR';font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;}
.qtype-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.qbox{background:white;border-radius:18px;padding:28px 22px;border:1.5px solid var(--border);box-shadow:0 2px 16px rgba(28,25,23,0.06);}
.q-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.q-word{font-family:'Noto Sans SC';font-weight:900;color:var(--ink);margin-bottom:22px;line-height:1.1;}
.q-word.big{font-size:54px;}
.q-word.med{font-size:38px;}
.q-word.ko{font-family:'Noto Sans KR';font-size:24px;font-weight:800;}
.q-word.sent{font-family:'Noto Sans SC';font-size:18px;font-weight:700;line-height:1.8;}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.q-opt{padding:14px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--warm);color:var(--ink);font-family:'Noto Sans SC';font-size:16px;font-weight:700;cursor:pointer;transition:all 0.18s;text-align:center;}
.q-opt.ko-opt{font-family:'Noto Sans KR';font-size:13px;}
.q-opt:hover:not(:disabled){border-color:var(--slate);background:white;transform:scale(1.02);}
.q-opt.ok{background:rgba(22,160,133,0.1);border-color:var(--teal);color:var(--teal);}
.q-opt.no{background:rgba(192,57,43,0.08);border-color:var(--red);color:var(--red);}
.q-fb{border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;margin-top:14px;display:none;}
.q-fb.show{display:block;animation:pop 0.25s ease;}
@keyframes pop{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.q-fb.ok{background:rgba(22,160,133,0.1);color:var(--teal);}
.q-fb.no{background:rgba(192,57,43,0.08);color:var(--red);}
.btn-next{width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:var(--paper);font-family:'Noto Sans KR';font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;display:none;transition:all 0.18s;}
.btn-next.show{display:block;}
.btn-next:hover{background:var(--red);}

/* SENTENCE */
.sent-card{background:white;border-radius:16px;padding:22px 20px;margin-bottom:14px;border:1.5px solid var(--border);box-shadow:0 1px 8px rgba(28,25,23,0.05);}
.sent-tag{display:inline-block;font-size:10px;font-weight:700;background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:4px;letter-spacing:0.5px;margin-bottom:12px;}
.sent-zh{font-family:'Noto Sans SC';font-size:20px;font-weight:700;color:var(--ink);line-height:1.7;margin-bottom:6px;}
.sent-zh .hl{color:var(--red);}
.sent-note{font-size:11px;color:var(--muted);margin-bottom:10px;font-style:italic;line-height:1.5;}
.sent-ko{font-size:14px;font-weight:600;color:var(--teal);padding:8px 12px;border-radius:8px;background:rgba(22,160,133,0.07);cursor:pointer;user-select:none;transition:filter 0.25s;}
.sent-ko.hide{filter:blur(5px);}
.reveal-hint{font-size:11px;color:var(--muted);margin-top:5px;cursor:pointer;}

/* FILL */
.fill-box{background:white;border-radius:16px;padding:26px 22px;border:1.5px solid var(--border);box-shadow:0 1px 8px rgba(28,25,23,0.05);}
.fill-num{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:14px;text-transform:uppercase;}
.fill-sent{font-family:'Noto Sans SC';font-size:20px;font-weight:700;line-height:1.8;color:var(--ink);margin-bottom:8px;}
.fill-blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--gold);color:var(--gold);font-weight:900;text-align:center;padding:0 4px;transition:all 0.3s;}
.fill-ko{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.fill-choices{display:flex;flex-wrap:wrap;gap:10px;}
.fill-opt{padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--warm);font-family:'Noto Sans SC';font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;transition:all 0.18s;}
.fill-opt:hover:not(:disabled){border-color:var(--gold);background:rgba(212,160,23,0.08);transform:scale(1.04);}
.fill-opt.ok{background:rgba(22,160,133,0.1);border-color:var(--teal);color:var(--teal);}
.fill-opt.no{background:rgba(192,57,43,0.08);border-color:var(--red);color:var(--red);animation:shk 0.35s;}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fill-fb{font-size:13px;font-weight:700;margin-top:12px;display:none;}
.fill-fb.show{display:block;}
.fill-fb.ok{color:var(--teal);}
.fill-fb.no{color:var(--red);}

/* WORD LIST */
.search{width:100%;padding:11px 16px;border-radius:10px;border:1.5px solid var(--border);background:white;font-family:'Noto Sans KR';font-size:14px;color:var(--ink);outline:none;margin-bottom:16px;}
.search:focus{border-color:var(--ink);}
.search::placeholder{color:var(--muted);}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.wtile{background:white;border-radius:12px;padding:16px 12px;border:1.5px solid var(--border);text-align:center;cursor:pointer;transition:all 0.18s;}
.wtile:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 4px 12px rgba(28,25,23,0.1);}
.wtile-zh{font-family:'Noto Sans SC';font-size:28px;font-weight:900;color:var(--ink);margin-bottom:4px;}
.wtile-py{font-size:11px;font-style:italic;color:var(--teal);margin-bottom:3px;display:none;}
.wtile:hover .wtile-py{display:block;}
.wtile-ko{font-size:12px;font-weight:700;color:var(--muted);}
.wtile-cat{font-size:10px;color:rgba(127,140,141,0.55);margin-top:3px;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-box{background:white;border-radius:14px;padding:20px 16px;border:1.5px solid var(--border);text-align:center;}
.stat-n{font-family:'Syne';font-size:34px;font-weight:800;color:var(--ink);}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:0.5px;}
.mrow{background:white;border-radius:14px;padding:18px 16px;border:1.5px solid var(--border);margin-bottom:10px;}
.mrow-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px;}
.mbar{background:rgba(28,25,23,0.08);border-radius:99px;height:8px;overflow:hidden;}
.mfill{height:100%;border-radius:99px;transition:width 0.6s ease;}
.btn-reset{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:transparent;font-family:'Noto Sans KR';font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-top:8px;transition:all 0.18s;}
.btn-reset:hover{background:var(--red);border-color:var(--red);color:white;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 22px;font-size:13px;font-weight:700;transition:transform 0.28s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.on{transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .q-opts{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr;}
  .hdr-scores{gap:6px;}
  .hdr-score{padding:5px 10px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-char">汉</div>
    <div>
      <div class="logo-text">HSK 3급 마스터</div>
      <div class="logo-sub">병음 없이 읽고 이해하기</div>
    </div>
  </div>
  <div class="hdr-scores">
    <div class="hdr-score"><div class="hdr-score-n" id="hPt">0</div><div class="hdr-score-l">포인트</div></div>
    <div class="hdr-score"><div class="hdr-score-n" id="hSt">0</div><div class="hdr-score-l">연속</div></div>
  </div>
</header>

<nav>
  <button class="on" onclick="go('fc')">📇 단어카드</button>
  <button onclick="go('quiz')">🎯 퀴즈</button>
  <button onclick="go('sent')">📝 문장</button>
  <button onclick="go('fill')">✏️ 빈칸</button>
  <button onclick="go('wl')">📚 단어장</button>
  <button onclick="go('stat')">📊 통계</button>
</nav>

<!-- FLASHCARD -->
<div id="fc" class="sec on">
  <div class="sec-head">📇 단어 카드 <em>병음 없이 읽기</em></div>
  <div class="fc-cat-row" id="catRow"></div>
  <div class="fc-meta"><span class="fc-prog" id="fcProg">0 / 0</span></div>
  <div class="pbar"><div class="pbar-fill" id="pbarFill" style="width:0%"></div></div>
  <div class="card-wrap">
    <div class="card-inner" id="cardInner" onclick="fcFlip()">
      <div class="card-f">
        <div class="card-badge" id="cardBadge"></div>
        <div class="card-hint">탭해서 뜻 확인 →</div>
        <div class="card-zh sz1" id="cardZh">—</div>
      </div>
      <div class="card-b">
        <div class="card-ko" id="cardKo">—</div>
        <div class="card-py" id="cardPy">—</div>
        <div class="card-ex" id="cardEx"></div>
        <div class="card-exko" id="cardExko"></div>
      </div>
    </div>
  </div>
  <div class="fc-actions">
    <button class="fcb fcb-f" onclick="fcFlip()">🔄 뒤집기</button>
  </div>
  <div class="fc-actions fc-rate" id="fcRate">
    <button class="fcb fcb-n" onclick="fcRate(false)">❌ 몰랐어요</button>
    <button class="fcb fcb-y" onclick="fcRate(true)">✅ 알았어요</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="sec">
  <div class="sec-head">🎯 퀴즈 <em>한자 읽기 집중</em></div>
  <div class="qtype-row">
    <button class="qtype-btn on" onclick="setQT('zh2ko',this)">한자→뜻</button>
    <button class="qtype-btn" onclick="setQT('ko2zh',this)">뜻→한자</button>
    <button class="qtype-btn" onclick="setQT('sent',this)">문장 빈칸</button>
  </div>
  <div class="qbox" id="quizBox"></div>
</div>

<!-- SENTENCE -->
<div id="sent" class="sec">
  <div class="sec-head">📝 핵심 문장 <em>HSK 3급 수준</em></div>
  <div id="sentList"></div>
</div>

<!-- FILL -->
<div id="fill" class="sec">
  <div class="sec-head">✏️ 빈칸 채우기 <em>문맥 파악</em></div>
  <div id="fillBox"></div>
</div>

<!-- WORD LIST -->
<div id="wl" class="sec">
  <div class="sec-head">📚 단어장 <em>마우스 올리면 병음 표시</em></div>
  <input class="search" id="searchInput" placeholder="한국어, 중국어로 검색…" oninput="filterWL()">
  <div class="word-grid" id="wordGrid"></div>
</div>

<!-- STATS -->
<div id="stat" class="sec">
  <div class="sec-head">📊 나의 학습 현황</div>
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-n" id="s1">0</div><div class="stat-l">총 정답</div></div>
    <div class="stat-box"><div class="stat-n" id="s2">0</div><div class="stat-l">총 오답</div></div>
    <div class="stat-box"><div class="stat-n" id="s3">0%</div><div class="stat-l">정답률</div></div>
    <div class="stat-box"><div class="stat-n" id="s4">0</div><div class="stat-l">포인트</div></div>
  </div>
  <div class="mrow"><div class="mrow-top"><span>✅ 완벽히 안다</span><span id="mp1">0%</span></div><div class="mbar"><div class="mfill" id="mf1" style="width:0%;background:var(--teal)"></div></div></div>
  <div class="mrow"><div class="mrow-top"><span>🟡 어느 정도</span><span id="mp2">0%</span></div><div class="mbar"><div class="mfill" id="mf2" style="width:0%;background:var(--gold)"></div></div></div>
  <div class="mrow"><div class="mrow-top"><span>🔴 아직 모른다</span><span id="mp3">100%</span></div><div class="mbar"><div class="mfill" id="mf3" style="width:100%;background:var(--red)"></div></div></div>
  <button class="btn-reset" onclick="doReset()">🔄 통계 초기화</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════ DATA ═══════════════
const W = [
  {zh:'搬',py:'bān',ko:'이사하다, 옮기다',cat:'동사',ex:'他们搬到新房子去了。',exko:'그들은 새 집으로 이사했어요.',key:'搬'},
  {zh:'被',py:'bèi',ko:'~에 의해 당하다 (피동)',cat:'동사',ex:'我的书被他借走了。',exko:'내 책이 그에게 빌려졌어요.',key:'被'},
  {zh:'比较',py:'bǐjiào',ko:'비교하다 / 비교적',cat:'동사',ex:'两个方案比较一下。',exko:'두 방안을 한번 비교해 보세요.',key:'比较'},
  {zh:'变化',py:'biànhuà',ko:'변화(하다)',cat:'명사',ex:'这里的变化非常大。',exko:'이곳의 변화가 매우 커요.',key:'变化'},
  {zh:'超过',py:'chāoguò',ko:'초과하다, 넘다',cat:'동사',ex:'他的分数超过了九十分。',exko:'그의 점수가 90점을 넘었어요.',key:'超过'},
  {zh:'出现',py:'chūxiàn',ko:'나타나다',cat:'동사',ex:'天空中出现了彩虹。',exko:'하늘에 무지개가 나타났어요.',key:'出现'},

let pts=0,streak=0,right=0,wrong=0;
let ratings={};
let fcCards=[...W],fcIdx=0,fcFlipped_=false;
let qt='zh2ko',quizW=null,quizDone=false;
let fillIdx=0,fillDone=false;

// ═══════════════ UTILS ═══════════════
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500);
}
function addPts(n){
  pts+=n;streak=n>0?streak+1:0;
  document.getElementById('hPt').textContent=pts;
  document.getElementById('hSt').textContent=streak;
  refreshStats();
}

// ═══════════════ NAV ═══════════════
function go(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  ['fc','quiz','sent','fill','wl','stat'].forEach((s,i)=>{
    if(s===id) document.querySelectorAll('nav button')[i].classList.add('on');
  });
  if(id==='sent') buildSent();
  if(id==='fill') buildFill();
  if(id==='quiz') buildQuiz();
  if(id==='wl') buildWL();
  if(id==='stat') refreshStats();
}

// ═══════════════ FLASHCARD ═══════════════
function buildCats(){
  const cats=['전체',...new Set(W.map(w=>w.cat))];
  document.getElementById('catRow').innerHTML=cats.map(c=>
    `<button class="cchip ${c==='전체'?'on':''}" onclick="setCat('${c}',this)">${c}</button>`
  ).join('');
}
function setCat(c,btn){
  document.querySelectorAll('.cchip').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  fcCards=c==='전체'?[...W]:W.filter(w=>w.cat===c);
  fcIdx=0;fcFlipped_=false;
  document.getElementById('cardInner').classList.remove('flip');
  document.getElementById('fcRate').classList.remove('show');
  renderFC();
}
function renderFC(){
  const w=fcCards[fcIdx];if(!w)return;
  document.getElementById('cardZh').textContent=w.zh;
  const len=w.zh.replace(/[…]/g,'').length;
  document.getElementById('cardZh').className='card-zh '+(len<=2?'sz1':len<=4?'sz2':'sz3');
  document.getElementById('cardBadge').textContent=w.cat;
  document.getElementById('cardKo').textContent=w.ko;
  document.getElementById('cardPy').textContent=w.py;
  let ex=w.ex;
  if(w.key){
    const parts=w.key.includes('…')?w.key.split('…'):[w.key];
    parts.forEach(p=>{if(p)ex=ex.replaceAll(p,`<span class="ex-hl">${p}</span>`);});
  }
  document.getElementById('cardEx').innerHTML=ex;
  document.getElementById('cardExko').textContent=w.exko;
  const pct=Math.round(fcIdx/fcCards.length*100);
  document.getElementById('pbarFill').style.width=pct+'%';
  document.getElementById('fcProg').textContent=`${fcIdx+1} / ${fcCards.length}`;
  fcFlipped_=false;
  document.getElementById('cardInner').classList.remove('flip');
  document.getElementById('fcRate').classList.remove('show');
}
function fcFlip(){
  fcFlipped_=!fcFlipped_;
  document.getElementById('cardInner').classList.toggle('flip',fcFlipped_);
  if(fcFlipped_)document.getElementById('fcRate').classList.add('show');
}
function fcRate(good){
  const i=W.indexOf(fcCards[fcIdx]);
  if(good){ratings[i]=ratings[i]==='ok'?'perfect':'ok';addPts(10);right++;toast('✅ +10 포인트!');}
  else{ratings[i]='learn';wrong++;toast('📖 다시 복습해요!');}
  fcIdx=(fcIdx+1)%fcCards.length;
  setTimeout(renderFC,280);
}

// ═══════════════ QUIZ ═══════════════
function setQT(t,btn){
  qt=t;
  document.querySelectorAll('.qtype-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');buildQuiz();
}
function buildQuiz(){
  quizDone=false;
  const box=document.getElementById('quizBox');
  if(qt==='sent'){
    // sentence blank — use접속사 words
    const pool=W.filter(w=>w.cat==='접속사');
    quizW=pool[Math.floor(Math.random()*pool.length)];
    let key=quizW.key||quizW.zh;
    const blanked=quizW.ex.replace(key,`<span style="color:var(--red);font-weight:900;">＿＿＿</span>`);
    const wrongs=W.filter(w=>w!==quizW&&w.cat==='접속사').sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.zh);
    const opts=[quizW.zh,...wrongs].sort(()=>Math.random()-0.5);
    box.innerHTML=`
      <div class="q-label">빈칸에 알맞은 단어를 고르세요</div>
      <div class="q-word sent" style="margin-bottom:8px;">${blanked}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:18px;">${quizW.exko}</div>
      <div class="q-opts">${opts.map(o=>`<button class="q-opt" onclick="checkQ(this,'${esc(o)}','${esc(quizW.zh)}')">${o}</button>`).join('')}</div>
      <div class="q-fb" id="qFB"></div>
      <button class="btn-next" id="qNext" onclick="buildQuiz()">다음 문제 →</button>`;
    return;
  }
  const pool=W.filter(w=>w.cat!=='접속사');
  quizW=pool[Math.floor(Math.random()*pool.length)];
  let label,mainHTML,correct,optClass,getOpt;
  if(qt==='zh2ko'){
    label='이 한자의 뜻은?';
    const l=quizW.zh.replace(/[…]/g,'').length;
    mainHTML=`<div class="q-word ${l<=2?'big':'med'}">${quizW.zh}</div>`;
    correct=quizW.ko;getOpt=w=>w.ko;optClass='ko-opt';
  } else {
    label='이 뜻에 맞는 한자는?';
    mainHTML=`<div class="q-word ko">${quizW.ko}</div>`;
    correct=quizW.zh;getOpt=w=>w.zh;optClass='';
  }
  const wrongs=pool.filter(w=>w!==quizW).sort(()=>Math.random()-0.5).slice(0,3).map(getOpt);
  const opts=[correct,...wrongs].sort(()=>Math.random()-0.5);
  box.innerHTML=`
    <div class="q-label">${label}</div>
    ${mainHTML}
    <div class="q-opts">${opts.map(o=>`<button class="q-opt ${optClass}" onclick="checkQ(this,'${esc(o)}','${esc(correct)}')">${o}</button>`).join('')}</div>
    <div class="q-fb" id="qFB"></div>
    <button class="btn-next" id="qNext" onclick="buildQuiz()">다음 문제 →</button>`;
}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function checkQ(btn,chosen,correct){
  if(quizDone)return;quizDone=true;
  document.querySelectorAll('.q-opt').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('ok');});
  const fb=document.getElementById('qFB');
  if(chosen===correct){
    btn.classList.add('ok');fb.textContent='🎉 정답! +20 포인트';fb.className='q-fb show ok';
    addPts(20);right++;
  } else {
    btn.classList.add('no');
    let msg=`❌ 오답. 정답: ${correct}`;
    if(qt==='zh2ko'&&quizW)msg+=`  (${quizW.py})`;
    fb.textContent=msg;fb.className='q-fb show no';wrong++;
  }
  document.getElementById('qNext').classList.add('show');
}

// ═══════════════ SENTENCES ═══════════════
function buildSent(){
  document.getElementById('sentList').innerHTML=S.map((s,i)=>{
    let zh=s.zh;
    if(s.key){
      const parts=s.key.split('…');
      if(parts.length>1)parts.forEach(p=>{if(p)zh=zh.replaceAll(p,`<span class="hl">${p}</span>`);});
      else zh=zh.replaceAll(s.key,`<span class="hl">${s.key}</span>`);
    }
    return `<div class="sent-card">
      <span class="sent-tag">${s.tag}</span>
      <div class="sent-zh" style="margin-top:10px">${zh}</div>
      <div class="sent-note">💡 ${s.note}</div>
      <div class="sent-ko hide" id="sk${i}" onclick="this.classList.toggle('hide')">${s.ko}</div>
      <div class="reveal-hint" onclick="document.getElementById('sk${i}').classList.toggle('hide')">👆 탭해서 해석 보기/숨기기</div>
    </div>`;
  }).join('');
}

// ═══════════════ FILL ═══════════════
function buildFill(){
  fillDone=false;
  const q=F[fillIdx%F.length];
  let sentHTML=q.sent;
  if(q.multi){
    let tmp=q.sent,pi=0;
    while(tmp.includes('___')){tmp=tmp.replace('___',`<span class="fill-blank" id="blk${pi}">___</span>`);pi++;}
    sentHTML=tmp;
  } else {
    sentHTML=q.sent.replace('___',`<span class="fill-blank" id="blk0">___</span>`);
  }
  document.getElementById('fillBox').innerHTML=`
    <div class="fill-box">
      <div class="fill-num">문제 ${(fillIdx%F.length)+1} / ${F.length}</div>
      <div class="fill-sent">${sentHTML}</div>
      <div class="fill-ko">${q.ko}</div>
      <div class="fill-choices">${q.choices.map(c=>`<button class="fill-opt" onclick="checkFill(this,'${esc(c)}','${esc(q.ans)}',${!!q.multi})">${c}</button>`).join('')}</div>
      <div class="fill-fb" id="fillFB"></div>
      <button class="btn-next" id="fillNext" style="display:none;margin-top:14px;" onclick="nextFill()">다음 문제 →</button>
    </div>`;
}
function checkFill(btn,chosen,ans,multi){
  if(fillDone)return;fillDone=true;
  document.querySelectorAll('.fill-opt').forEach(b=>b.disabled=true);
  const blk0=document.getElementById('blk0');
  const blk1=document.getElementById('blk1');
  const fb=document.getElementById('fillFB');
  const isOk=chosen===ans;
  if(multi){
    const parts=ans.split('/');
    if(blk0)blk0.textContent=parts[0]||'';
    if(blk1)blk1.textContent=parts[1]||'';
  } else {
    if(blk0)blk0.textContent=ans;
  }
  document.querySelectorAll('.fill-opt').forEach(b=>{
    const disp=multi?b.textContent:b.textContent;
    if(b.textContent===ans)b.classList.add('ok');
  });
  if(isOk){
    btn.classList.add('ok');fb.textContent='✅ 정답! +15 포인트';fb.className='fill-fb show ok';
    addPts(15);right++;
  } else {
    btn.classList.add('no');fb.textContent=`❌ 정답: ${ans}`;fb.className='fill-fb show no';wrong++;
  }
  document.getElementById('fillNext').style.display='block';
}
function nextFill(){fillIdx++;buildFill();}

// ═══════════════ WORD LIST ═══════════════
function buildWL(q=''){
  const list=q?W.filter(w=>w.zh.includes(q)||w.ko.includes(q)||w.py.toLowerCase().includes(q.toLowerCase())):W;
  document.getElementById('wordGrid').innerHTML=list.map(w=>`
    <div class="wtile">
      <div class="wtile-zh">${w.zh}</div>
      <div class="wtile-py">${w.py}</div>
      <div class="wtile-ko">${w.ko}</div>
      <div class="wtile-cat">${w.cat}</div>
    </div>`).join('');
}
function filterWL(){buildWL(document.getElementById('searchInput').value);}

// ═══════════════ STATS ═══════════════
function refreshStats(){
  const tot=right+wrong;
  document.getElementById('s1').textContent=right;
  document.getElementById('s2').textContent=wrong;
  document.getElementById('s3').textContent=tot?Math.round(right/tot*100)+'%':'0%';
  document.getElementById('s4').textContent=pts;
  const perf=Object.values(ratings).filter(v=>v==='perfect').length;
  const ok=Object.values(ratings).filter(v=>v==='ok').length;
  const n=W.length;
  const p1=Math.round(perf/n*100),p2=Math.round(ok/n*100),p3=100-p1-p2;
  ['mp1','mp2','mp3'].forEach((id,i)=>document.getElementById(id).textContent=[p1,p2,p3][i]+'%');
  document.getElementById('mf1').style.width=p1+'%';
  document.getElementById('mf2').style.width=p2+'%';
  document.getElementById('mf3').style.width=p3+'%';
}
function doReset(){
  if(!confirm('통계를 초기화할까요?'))return;
  pts=0;streak=0;right=0;wrong=0;ratings={};
  document.getElementById('hPt').textContent=0;
  document.getElementById('hSt').textContent=0;
  refreshStats();toast('🔄 초기화 완료!');
}

// ═══════════════ INIT ═══════════════
buildCats();renderFC();buildWL();
</script>
